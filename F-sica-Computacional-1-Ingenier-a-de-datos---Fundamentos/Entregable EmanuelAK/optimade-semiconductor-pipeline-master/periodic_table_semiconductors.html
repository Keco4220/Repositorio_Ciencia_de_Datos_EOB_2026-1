
<h2 class="sr-only">Tabla periódica interactiva de semiconductores — haz clic en un elemento para ver la mejor aleación del pipeline.</h2>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#pt-wrap{padding:1rem 0}
#controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#controls label{font-size:12px;color:var(--color-text-secondary)}
#mode-btn{font-size:12px;padding:4px 10px;cursor:pointer;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary)}
#mode-btn:hover{background:var(--color-background-tertiary)}
#legend{display:flex;gap:4px;align-items:center;margin-left:auto}
.leg-box{width:12px;height:12px;border-radius:2px}
#legend span{font-size:11px;color:var(--color-text-secondary)}
#pt-grid{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;width:100%}
.cell{border-radius:4px;cursor:default;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 1px;min-height:38px;border:0.5px solid transparent;transition:transform 0.1s,border-color 0.1s;position:relative}
.cell.has-data{cursor:pointer}
.cell.has-data:hover{transform:scale(1.12);z-index:10;border-color:var(--color-border-primary)}
.cell.active{transform:scale(1.12);z-index:10;border-color:var(--color-border-primary);outline:2px solid #378ADD}
.cell .sym{font-size:11px;font-weight:500;line-height:1;color:var(--color-text-primary)}
.cell .num{font-size:8px;color:var(--color-text-secondary);line-height:1}
.cell.empty{background:transparent;border:none;cursor:default}
.cell.no-data{background:var(--color-background-secondary);opacity:0.5}
.cell.no-data .sym{color:var(--color-text-tertiary)}
#panel{margin-top:12px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;background:var(--color-background-primary);display:none}
#panel.visible{display:block}
#panel-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
#panel-elem{font-size:28px;font-weight:500;color:var(--color-text-primary)}
#panel-formula{font-size:18px;font-weight:500;color:#185FA5;margin-bottom:2px}
#panel-id{font-size:11px;color:var(--color-text-tertiary)}
#panel-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{font-size:11px;padding:3px 8px;border-radius:var(--border-radius-md);font-weight:500}
.badge-direct{background:#EAF3DE;color:#3B6D11}
.badge-indirect{background:#F1EFE8;color:#5F5E5A}
.badge-stable{background:#E1F5EE;color:#0F6E56}
.badge-crystal{background:#E6F1FB;color:#185FA5}
#panel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:500px){#panel-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.stat-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
.stat-val{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.stat-unit{font-size:10px;color:var(--color-text-tertiary);margin-left:2px}
#score-bar-wrap{margin-top:12px}
#score-bar-label{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
#score-bar-bg{background:var(--color-background-secondary);border-radius:4px;height:8px;width:100%;overflow:hidden}
#score-bar-fill{height:8px;border-radius:4px;background:#378ADD;transition:width 0.4s}
#score-val{font-size:11px;color:var(--color-text-secondary);margin-top:2px;text-align:right}
#elem-stats{margin-top:12px;border-top:0.5px solid var(--color-border-tertiary);padding-top:10px}
#elem-stats-title{font-size:11px;color:var(--color-text-secondary);margin-bottom:6px}
#elem-stats-row{display:flex;gap:16px;flex-wrap:wrap}
.elem-stat{font-size:12px;color:var(--color-text-primary)}
.elem-stat span{color:var(--color-text-secondary);font-size:11px}
#panel-mp-link{font-size:11px;color:#185FA5;cursor:pointer;text-decoration:underline;margin-top:8px;display:inline-block}
#tip{font-size:11px;color:var(--color-text-tertiary);margin-top:8px;text-align:center}
#panel-elems{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.el-pill{font-size:11px;padding:2px 7px;border-radius:10px;background:#E6F1FB;color:#185FA5;font-weight:500}
.el-pill.active-el{background:#185FA5;color:#fff}
</style>

let colorMode = 'score';
let activeEl = null;

function scoreToColor(score) {
  if (!score) return null;
  const mn=0.92, mx=1.04, t=Math.min(1,Math.max(0,(score-mn)/(mx-mn)));
  const stops = [[181,212,244],[55,138,221],[12,68,124]];
  let r,g,b;
  if(t<0.5){const u=t*2;r=Math.round(stops[0][0]+(stops[1][0]-stops[0][0])*u);g=Math.round(stops[0][1]+(stops[1][1]-stops[0][1])*u);b=Math.round(stops[0][2]+(stops[1][2]-stops[0][2])*u);}
  else{const u=(t-0.5)*2;r=Math.round(stops[1][0]+(stops[2][0]-stops[1][0])*u);g=Math.round(stops[1][1]+(stops[2][1]-stops[1][1])*u);b=Math.round(stops[1][2]+(stops[2][2]-stops[1][2])*u);}
  return `rgb(${r},${g},${b})`;
}

function bgColor(score) {
  if(colorMode==='score') return scoreToColor(score);
  return '#378ADD';
}

function buildPT() {
  const grid = document.getElementById('pt-grid');
  grid.innerHTML='';
  PT.forEach((row,ri)=>{
    for(let ci=0;ci<18;ci++){
      const el=row.find(e=>e.c===ci+1)||{};
      const div=document.createElement('div');
      if(!el.s){div.className='cell empty';grid.appendChild(div);continue;}
      const data=ELEM_MAP[el.s];
      const stats=ELEM_STATS[el.s];
      const val=data?(colorMode==='score'?data.score:(stats?stats.avg_bg:null)):null;
      div.className='cell'+(data?' has-data':' no-data');
      const col=data?bgColor(val):null;
      if(col)div.style.background=col;
      div.innerHTML=`<span class="num">${el.n}</span><span class="sym" style="${col?'color:#fff':''}">${el.s}</span>`;
      if(data)div.onclick=()=>showPanel(el.s,div);
      grid.appendChild(div);
    }
    if(ri===5){const sp=document.createElement('div');sp.className='cell empty';grid.appendChild(sp);}
  });
}

function toggleMode(){
  colorMode=colorMode==='score'?'bandgap':'score';
  document.getElementById('mode-btn').textContent=colorMode==='score'?'Score semiconductor':'Band gap promedio';
  const lg=document.getElementById('legend');
  if(colorMode==='bandgap'){
    lg.innerHTML='<div class="leg-box" style="background:#B5D4F4"></div><span>0.9 eV</span><div class="leg-box" style="background:#378ADD;margin-left:2px"></div><span>1.2 eV</span><div class="leg-box" style="background:#0C447C;margin-left:2px"></div><span>1.5 eV</span>';
  } else {
    lg.innerHTML='<div class="leg-box" style="background:#B5D4F4"></div><span>bajo</span><div class="leg-box" style="background:#378ADD;margin-left:2px"></div><span>medio</span><div class="leg-box" style="background:#0C447C;margin-left:2px"></div><span>alto</span>';
  }
  buildPT();
  if(activeEl)document.querySelectorAll('.cell.active').forEach(c=>c.classList.remove('active'));
}

function showPanel(sym,div){
  const d=ELEM_MAP[sym];
  const st=ELEM_STATS[sym];
  if(!d)return;
  document.querySelectorAll('.cell.active').forEach(c=>c.classList.remove('active'));
  div.classList.add('active');
  activeEl=sym;
  document.getElementById('panel-elem').textContent=sym;
  document.getElementById('panel-formula').textContent=d.formula;
  document.getElementById('panel-id').textContent=d.id+' · '+d.crystal_system+' · '+d.nelements+' elementos';
  const pe=document.getElementById('panel-elems');
  pe.innerHTML=d.elements.map(e=>`<span class="el-pill${e===sym?' active-el':''}">${e}</span>`).join('');
  const pb=document.getElementById('panel-badges');
  pb.innerHTML=`<span class="badge ${d.is_gap_direct?'badge-direct':'badge-indirect'}">${d.is_gap_direct?'Gap directo':'Gap indirecto'}</span><span class="badge badge-stable">${d.is_stable?'Estable':'Inestable'}</span><span class="badge badge-crystal">${d.crystal_system}</span>`;
  const stats=[
    {l:'Band gap',v:d.band_gap.toFixed(3),u:'eV'},
    {l:'Densidad',v:d.density?d.density.toFixed(3):'-',u:'g/cm³'},
    {l:'Índice n',v:d.n?d.n.toFixed(3):'-',u:'DFT'},
    {l:'Módulo B',v:d.bulk_modulus?d.bulk_modulus.toFixed(0):'-',u:'GPa'},
    {l:'Módulo G',v:d.shear_modulus?d.shear_modulus.toFixed(0):'-',u:'GPa'},
    {l:'E_hull',v:d.energy_above_hull.toFixed(4),u:'eV/at'},
    {l:'ΔHf/átomo',v:d.formation_energy?d.formation_energy.toFixed(3):'-',u:'eV'},
    {l:'ε_electrónico',v:d.n?(d.n*d.n).toFixed(2):'-',u:''},
  ];
  document.getElementById('panel-grid').innerHTML=stats.map(s=>`<div class="stat-card"><div class="stat-label">${s.l}</div><div class="stat-val">${s.v}<span class="stat-unit">${s.u}</span></div></div>`).join('');
  const pct=Math.min(100,Math.max(0,(d.score-0.9)/(1.05-0.9)*100));
  document.getElementById('score-bar-fill').style.width=pct.toFixed(1)+'%';
  document.getElementById('score-val').textContent='Score: '+d.score.toFixed(4)+' (rango 0.9–1.05)';
  if(st){
    document.getElementById('elem-stats-title').textContent=`Estadísticas de ${sym} en el pipeline (${st.count} materiales)`;
    document.getElementById('elem-stats-row').innerHTML=`<div class="elem-stat"><span>Bg prom.</span> ${st.avg_bg} eV</div><div class="elem-stat"><span>Score prom.</span> ${st.avg_score}</div><div class="elem-stat"><span>Estables</span> ${st.stable_count}/${st.count}</div><div class="elem-stat"><span>Gap directo</span> ${st.direct_count}/${st.count}</div>`;
  }
  const mp=document.getElementById('panel-mp-link');
  mp.textContent='Ver en Materials Project →';
  mp.onclick=()=>openLink('https://next.materialsproject.org/materials/'+d.id);
  document.getElementById('panel').classList.add('visible');
}
